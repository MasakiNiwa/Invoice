name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Colab 版サーバー(Python)のテスト。ビルド済みの UI と PaddleOCR のモデルを使う
  colab-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: colab/server/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: pip install -r colab/server/requirements.txt pytest httpx
      - run: python -m pytest -q
        working-directory: colab/server
